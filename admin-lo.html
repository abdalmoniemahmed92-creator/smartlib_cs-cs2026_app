<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل دخول الإدارة - المكتبة الرقمية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 350px; text-align: center; }
        h2 { color: #34495e; margin-bottom: 20px; }
        label { display: block; text-align: right; margin-top: 10px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; background: #28a745; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #218838; }
        .error { color: red; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>لوحة تحكم المكتبة الإدارية</h2>
    
    <label>البريد الإلكتروني للإدارة</label>
    <input type="email" id="adminEmail" placeholder="admin@univ.edu">

    <label>كلمة المرور</label>
    <input type="password" id="adminPassword" placeholder="••••••••">

    <button onclick="loginAdmin()">دخول لوحة التحكم</button>
    <div id="adminMsg" class="error"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore.js";

    const firebaseConfig = { apiKey: "...", authDomain: "...", projectId: "..." };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.loginAdmin = async function() {
        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value;
        const msg = document.getElementById('adminMsg');
        msg.innerText = "";

        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // التحقق من صلاحية المدير
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists() && userDoc.data().role === "admin") {
                localStorage.setItem("adminUid", user.uid);
                window.location.href = "admin.html";
            } else {
                msg.innerText = "عذراً، لا تملك صلاحيات الوصول للوحة التحكم.";
            }
        } catch (error) {
            msg.innerText = "بيانات الدخول غير صحيحة: " + error.message;
        }
    }
</script>
</body>
</html>
